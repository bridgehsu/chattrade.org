name: Build and Deploy ChatTrade Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Custom domain for GitHub Pages. Leave empty to publish at
# https://<user>.github.io/<repo>/ and set DOCS_BASE to "/<repo>/".
env:
  CUSTOM_DOMAIN: chattrade.org
  DOCS_BASE: /

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build VitePress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check documentation links
        run: npm run check

      - name: Resolve site URL
        id: site
        run: |
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            echo "docs_site=https://${CUSTOM_DOMAIN}" >> "$GITHUB_OUTPUT"
          else
            echo "docs_site=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_EVENT_REPOSITORY_NAME}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Build documentation
        env:
          DOCS_BASE: ${{ env.DOCS_BASE }}
          DOCS_SITE: ${{ steps.site.outputs.docs_site }}
        run: npm run build

      - name: Prepare GitHub Pages files
        run: |
          touch dist/.nojekyll
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            printf '%s\n' "${CUSTOM_DOMAIN}" > dist/CNAME
          else
            rm -f dist/CNAME
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chattrade-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy-actions:
    name: Deploy via GitHub Actions Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

  # Fallback when Settings → Pages Source is "Deploy from a branch".
  # Publishing VitePress dist/ here avoids Jekyll rendering docs/*.md from main.
  publish-branch:
    name: Publish gh-pages branch
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download built website
        uses: actions/download-artifact@v4
        with:
          name: chattrade-dist-${{ github.sha }}
          path: dist

      - name: Publish dist to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          single-commit: true
