# Install a certificate for tgex.net and configure TLS in your hosting environment.
server {
    listen 80;
    server_name tgex.net;
    root /var/www/tgex.net/dist;
    index index.html;
    charset utf-8;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
