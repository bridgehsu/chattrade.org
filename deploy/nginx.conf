# Install a certificate for chattrade.org and configure TLS in your hosting environment.
server {
    listen 80;
    server_name chattrade.org;
    root /var/www/chattrade.org/dist;
    index index.html;
    charset utf-8;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
